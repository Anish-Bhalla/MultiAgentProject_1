services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
      DOCUMENTS_DIR: /app/data/documents
      BUSINESS_DB_PATH: /app/data/demo_business.sqlite
      STATE_DB_PATH: /app/data/app_state.sqlite
      CHROMA_DIR: /app/data/chroma
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
